          docker compose up -d || echo "⚠️ Manual rollback required"
          exit 1
      
      - name: 📊 Cleanup resources
        if: success()
        run: |
          echo "🧹 Cleaning up..."
          docker image prune -f --filter "dangling=true" > /dev/null 2>&1 || true
          docker volume prune -f > /dev/null 2>&1 || true
          docker network prune -f > /dev/null 2>&1 || true
          echo "✅ Cleanup completed"
      
      - name: ✅ Success notification
        if: success()
        run: |
          echo "✅ Testing Deployment Successful!"
          echo ""
          echo "📋 Deployment Details:"
          echo "  Environment: Testing (galgo-home ARM64)"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ steps.build.outputs.commit_sha }}"
          echo "  Version: ${{ steps.build.outputs.version }}"
          echo ""
          echo "🔗 Services:"
          echo "  API: http://galgo-home:3000"
          echo "  Client: http://galgo-home:5173"