name: Deploy to Self-Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: self-hosted
    name: Pre-Deploy Validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose syntax
        run: |
          echo "🔍 Validando sintaxis de docker-compose.yml..."
          docker-compose config > /dev/null && echo "✅ Docker Compose válido"

      - name: Check Node.js and npm
        run: |
          echo "🔍 Verificando Node.js y npm..."
          node --version
          npm --version

      - name: Validate package.json files
        run: |
          echo "🔍 Validando package.json files..."
          for dir in client-configurator server; do
            if [ -d "$dir" ]; then
              echo "  Verificando $dir/package.json..."
              if ! node -e "require('./$dir/package.json')" 2>/dev/null; then
                echo "❌ Error en $dir/package.json"
                exit 1
              fi
              echo "  ✅ $dir/package.json válido"
            fi
          done

      - name: Lint client code
        run: |
          echo "🔍 Ejecutando lint en cliente..."
          cd client-configurator
          if [ -f ".eslintrc.js" ]; then
            npm run lint 2>&1 | head -50 || echo "⚠️ Lint encontró problemas (no crítico)"
          else
            echo "⚠️ No se encontró .eslintrc.js"
          fi

      - name: Lint server code
        run: |
          echo "🔍 Ejecutando lint en servidor..."
          cd server
          if [ -f ".eslintrc.js" ] || [ -f "package.json" ]; then
            npm run lint 2>&1 | head -50 || echo "⚠️ Lint encontró problemas (no crítico)"
          else
            echo "⚠️ No se encontró configuración de lint"
          fi

      - name: Verify required environment files
        run: |
          echo "🔍 Verificando archivos de configuración..."
          required_files=("docker-compose.yml" ".gitignore")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Error: Archivo requerido no encontrado: $file"
              exit 1
            fi
            echo "  ✅ $file presente"
          done

      - name: Check for sensitive data
        run: |
          echo "🔍 Verificando datos sensibles..."
          if grep -r "password" .github/ 2>/dev/null; then
            echo "⚠️ Posible exposición de credenciales en .github"
          fi
          echo "  ✅ Verificación completada"

      - name: Validation Summary
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "✅ PRE-DEPLOY VALIDATION PASSED"
          echo "════════════════════════════════════════"
          echo "✓ Docker Compose válido"
          echo "✓ Node.js y npm disponibles"
          echo "✓ package.json válidos"
          echo "✓ Lint ejecutado"
          echo "✓ Archivos de configuración presentes"
          echo "✓ Ningún dato sensible detectado"
          echo "════════════════════════════════════════"

  deploy:
    needs: validate
    runs-on: self-hosted
    name: Deploy Services

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get build information
        id: build-info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git log -1 --format=%aI)
          VERSION=$(git describe --tags --always 2>/dev/null || echo "latest")
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          
          echo "📌 Build Information:"
          echo "  SHA: $COMMIT_SHA"
          echo "  Date: $COMMIT_DATE"
          echo "  Version: $VERSION"
          echo "  Branch: $BRANCH"

      - name: Stop existing containers
        run: docker compose down || true

      - name: Backup current images (for rollback)
        run: |
          echo "💾 Creando backup de imágenes actuales..."
          mkdir -p /tmp/deployment-backup
          
          # Guardar IDs de imágenes actuales
          SERVER_IMAGE=$(docker images galgo-server:latest --quiet 2>/dev/null || echo "none")
          CLIENT_IMAGE=$(docker images galgo-client:latest --quiet 2>/dev/null || echo "none")
          
          echo "$SERVER_IMAGE" > /tmp/deployment-backup/server-image.txt
          echo "$CLIENT_IMAGE" > /tmp/deployment-backup/client-image.txt
          
          if [ "$SERVER_IMAGE" != "none" ] && [ "$CLIENT_IMAGE" != "none" ]; then
            echo "✅ Backup creado (Server: $SERVER_IMAGE, Client: $CLIENT_IMAGE)"
          else
            echo "ℹ️ No hay imágenes previas para backup"
          fi

      - name: Remove old images
        run: |
          echo "🗑️ Limpiando imágenes antiguas..."
          docker rmi galgo-server:latest || true
          docker rmi galgo-client:latest || true
          echo "✅ Imágenes antiguas eliminadas"

      - name: Build and start services with version tags
        env:
          BUILD_DATE: ${{ steps.build-info.outputs.commit_date }}
          VCS_REF: ${{ steps.build-info.outputs.commit_sha }}
          VERSION: ${{ steps.build-info.outputs.version }}
        run: |
          echo "🔨 Construyendo servicios..."
          echo "  Version: $VERSION"
          echo "  Commit: $VCS_REF"
          echo "  Date: $BUILD_DATE"
          
          # Build con argumentos de versión
          docker compose build \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg VCS_REF="$VCS_REF" \
            --build-arg VERSION="$VERSION"
          
          echo "🚀 Iniciando servicios..."
          docker compose up -d
          echo "✅ Servicios iniciados"

      - name: Tag images with version
        run: |
          VERSION="${{ steps.build-info.outputs.version }}"
          COMMIT_SHA="${{ steps.build-info.outputs.commit_sha }}"
          
          echo "🏷️ Tagging images..."
          docker tag galgo-server:latest "galgo-server:$VERSION" || true
          docker tag galgo-server:latest "galgo-server:$COMMIT_SHA" || true
          docker tag galgo-client:latest "galgo-client:$VERSION" || true
          docker tag galgo-client:latest "galgo-client:$COMMIT_SHA" || true
          
          echo "✅ Images tagged:"
          docker images | grep galgo

      - name: Show running containers
        run: |
          echo "📦 Contenedores corriendo:"
          docker ps

      - name: Show deployment logs
        run: |
          echo "📋 Últimos 100 líneas de logs:"
          docker compose logs --tail=100

      - name: Wait for services to be healthy
        run: |
          echo "⏳ Esperando a que los servicios estén saludables..."
          
          # Configuración
          MAX_ATTEMPTS=30
          WAIT_TIME=2
          SERVER_URL="http://localhost:3000"
          
          # Función para verificar salud
          check_health() {
            if curl -sf "$SERVER_URL/health" > /dev/null 2>&1; then
              return 0
            else
              return 1
            fi
          }
          
          # Intentar conexión
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "  Intento $i/$MAX_ATTEMPTS..."
            
            if check_health; then
              echo "✅ Servidor saludable"
              exit 0
            fi
            
            # Mostrar estado de contenedores
            if [ $((i % 5)) -eq 0 ]; then
              echo "  Estado de contenedores:"
              docker compose ps | tail -5
            fi
            
            if [ $i -lt $MAX_ATTEMPTS ]; then
              sleep $WAIT_TIME
            fi
          done
          
          echo "❌ Timeout: Servidor no respondió después de $((MAX_ATTEMPTS * WAIT_TIME)) segundos"
          echo "📋 Estado final de contenedores:"
          docker compose ps
          echo "📋 Logs de error:"
          docker compose logs | tail -30
          exit 1

      - name: Verify all services are running
        run: |
          echo "🔍 Verificando que todos los servicios estén corriendo..."
          
          # Verificar que no hay contenedores parados
          stopped=$(docker compose ps -q --filter "status=exited" 2>/dev/null | wc -l)
          running=$(docker compose ps -q --filter "status=running" 2>/dev/null | wc -l)
          
          echo "  Contenedores corriendo: $running"
          echo "  Contenedores parados: $stopped"
          
          if [ "$stopped" -gt 0 ]; then
            echo "❌ Hay contenedores parados"
            docker compose ps
            exit 1
          fi
          
          echo "✅ Todos los servicios están corriendo"

      - name: Deployment Summary
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "════════════════════════════════════════"
          echo "📦 Contenedores activos:"
          docker compose ps --format "table {{.Names}}\t{{.Status}}"
          echo ""
          echo "🏷️ Imágenes desplegadas:"
          docker images | grep galgo | head -10
          echo ""
          echo "📋 Build Information:"
          echo "  Version: ${{ steps.build-info.outputs.version }}"
          echo "  Commit: ${{ steps.build-info.outputs.commit_sha }}"
          echo "  Branch: ${{ steps.build-info.outputs.branch }}"
          echo "  Date: ${{ steps.build-info.outputs.commit_date }}"
          echo ""
          echo "🔗 Servicios disponibles:"
          echo "  - API: http://localhost:3000"
          echo "  - Cliente: http://localhost:5173"
          echo "════════════════════════════════════════"

      - name: On failure - Attempt rollback
        if: failure()
        run: |
          echo "❌ Deployment failed, attempting rollback..."
          
          SERVER_IMAGE=$(cat /tmp/deployment-backup/server-image.txt 2>/dev/null || echo "none")
          CLIENT_IMAGE=$(cat /tmp/deployment-backup/client-image.txt 2>/dev/null || echo "none")
          
          if [ "$SERVER_IMAGE" = "none" ] || [ "$CLIENT_IMAGE" = "none" ]; then
            echo "⚠️ No hay backup disponible para rollback"
            echo "📋 Estado actual de contenedores:"
            docker compose ps || true
            echo "📋 Logs de error:"
            docker compose logs --tail=50 || true
            exit 1
          fi
          
          echo "🔄 Realizando rollback a versión anterior..."
          docker compose down || true
          
          # Reconstruir con imágenes previas
          docker compose up -d
          
          # Esperar a que servicios se recuperen
          sleep 10
          
          if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
            echo "✅ Rollback exitoso, servicios restaurados"
            docker compose ps
          else
            echo "❌ Rollback falló, servicios aún no están disponibles"
            docker compose logs --tail=50
            exit 1
          fi

      - name: Deployment Success Notification
        if: success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║  ✅ DEPLOYMENT COMPLETED SUCCESSFULLY  ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📌 Deployment Details:"
          echo "   Version: ${{ steps.build-info.outputs.version }}"
          echo "   Commit: ${{ steps.build-info.outputs.commit_sha }}"
          echo "   Branch: ${{ steps.build-info.outputs.branch }}"
          echo "   Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "🎯 Services Status: ALL HEALTHY ✅"
          echo ""
          echo "📞 You can notify team members about successful deployment"

      - name: Deployment Failure Notification
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║  ❌ DEPLOYMENT FAILED                  ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📌 Failed Deployment Details:"
          echo "   Version: ${{ steps.build-info.outputs.version }}"
          echo "   Commit: ${{ steps.build-info.outputs.commit_sha }}"
          echo "   Branch: ${{ steps.build-info.outputs.branch }}"
          echo "   Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "📋 Actions Taken:"
          echo "   - Attempted automatic rollback"
          echo "   - Checked service health"
          echo ""
          echo "⚠️ MANUAL INTERVENTION REQUIRED"
          echo "   Please check the workflow logs for details"