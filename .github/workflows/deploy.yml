name: Deploy to Self-Hosted Runners

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'

jobs:
  # ✅ Validación Pre-Deploy
  validate:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔍 Check Docker Compose syntax
        run: |
          if command -v docker-compose &> /dev/null; then
            docker-compose config > /dev/null && echo "✅ docker-compose.yml is valid"
          elif command -v docker &> /dev/null; then
            docker compose config > /dev/null && echo "✅ docker-compose.yml is valid"
          else
            echo "⚠️ Docker not found, skipping validation"
          fi
      
      - name: 🔍 Verify Node.js and npm
        run: |
          node --version
          npm --version
      
      - name: 🔍 Validate package.json files
        run: |
          for file in package.json client-configurator/package.json server/package.json; do
            if [ -f "$file" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))" && echo "✅ $file is valid"
            fi
          done

  # 🚀 Deploy a Producción (main → galgo-mini-01 X64)
  deploy-production:
    name: Deploy to Production (galgo-mini-01)
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, galgo-mini-01]
    environment:
      name: production
      url: http://galgo-mini-01:3000
    steps:
      - uses: actions/checkout@v4
      
      - name: 🏷️ Get build info
        id: build
        run: |
          VERSION=$(cat package.json | grep '"version"' | head -1 | awk -F'"' '{print $4}')
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
      
      - name: 💾 Backup current images
        run: |
          mkdir -p /tmp/galgo-backup
          docker ps -a --format "{{.ID}} {{.Names}} {{.Image}}" | grep galgo > /tmp/galgo-backup/containers.txt || true
          docker images --format "{{.Repository}}\t{{.Tag}}\t{{.ID}}" | grep galgo > /tmp/galgo-backup/images.txt || true
          echo "✅ Backup created"
      
      - name: 🐳 Build and deploy
        env:
          BUILD_DATE: ${{ steps.build.outputs.build_date }}
          VCS_REF: ${{ steps.build.outputs.commit_sha }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          echo "🔨 Building images for PRODUCTION..."
          docker compose build \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg VCS_REF="$VCS_REF" \
            --build-arg VERSION="$VERSION"
          
          echo "🚀 Starting services..."
          docker compose down || true
          sleep 2
          docker compose up -d
          echo "✅ Services started"
      
      - name: 🏷️ Tag images
        run: |
          VERSION="${{ steps.build.outputs.version }}"
          COMMIT_SHA="${{ steps.build.outputs.commit_sha }}"
          docker tag galgo-school-client:latest galgo-school-client:${VERSION}-${COMMIT_SHA:0:7} || true
          docker tag galgo-school-server:latest galgo-school-server:${VERSION}-${COMMIT_SHA:0:7} || true
      
      - name: 🏥 Health check
        id: health
        timeout-minutes: 2
        run: |
          echo "🏥 Checking service health..."
          MAX_ATTEMPTS=30
          RETRY_DELAY=2
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Service healthy (attempt $attempt/$MAX_ATTEMPTS)"
              exit 0
            fi
            
            if [ $((attempt % 5)) -eq 0 ]; then
              echo "⏳ Waiting... (attempt $attempt/$MAX_ATTEMPTS)"
              docker-compose ps
            fi
            
            sleep $RETRY_DELAY
          done
          
          echo "❌ Health check failed"
          docker compose logs
          exit 1
      
      - name: 🔄 Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "❌ Deployment failed, rolling back..."
          docker compose down || true
          sleep 2
          docker compose up -d || echo "⚠️ Manual rollback required"
          exit 1
      
      - name: 📊 Cleanup resources
        if: success()
        run: |
          echo "🧹 Cleaning up..."
          docker image prune -f --filter "dangling=true" > /dev/null 2>&1 || true
          docker volume prune -f > /dev/null 2>&1 || true
          docker network prune -f > /dev/null 2>&1 || true
          echo "✅ Cleanup completed"
      
      - name: ✅ Success notification
        if: success()
        run: |
          echo "✅ Production Deployment Successful!"
          echo ""
          echo "📋 Deployment Details:"
          echo "  Environment: Production (galgo-mini-01 X64)"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ steps.build.outputs.commit_sha }}"
          echo "  Version: ${{ steps.build.outputs.version }}"
          echo ""
          echo "🔗 Services:"
          echo "  API: http://galgo-mini-01:3000"
          echo "  Client: http://galgo-mini-01:5173"

  # 🧪 Deploy a Testing (no main → galgo-home ARM64)
  deploy-testing:
    name: Deploy to Testing (galgo-home)
    needs: validate
    if: github.ref != 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, galgo-home]
    environment:
      name: testing
      url: http://galgo-home:3000
    steps:
      - uses: actions/checkout@v4
      
      - name: 🏷️ Get build info
        id: build
        run: |
          VERSION=$(cat package.json | grep '"version"' | head -1 | awk -F'"' '{print $4}')
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
      
      - name: 💾 Backup current images
        run: |
          mkdir -p /tmp/galgo-backup
          docker ps -a --format "{{.ID}} {{.Names}} {{.Image}}" | grep galgo > /tmp/galgo-backup/containers.txt || true
          docker images --format "{{.Repository}}\t{{.Tag}}\t{{.ID}}" | grep galgo > /tmp/galgo-backup/images.txt || true
          echo "✅ Backup created"
      
      - name: 🐳 Build and deploy
        env:
          BUILD_DATE: ${{ steps.build.outputs.build_date }}
          VCS_REF: ${{ steps.build.outputs.commit_sha }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          echo "🔨 Building images for TESTING..."
          docker compose build \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg VCS_REF="$VCS_REF" \
            --build-arg VERSION="$VERSION"
          
          echo "🚀 Starting services..."
          docker compose down || true
          sleep 2
          docker compose up -d
          echo "✅ Services started"
      
      - name: 🏷️ Tag images
        run: |
          VERSION="${{ steps.build.outputs.version }}"
          COMMIT_SHA="${{ steps.build.outputs.commit_sha }}"
          docker tag galgo-school-client:latest galgo-school-client:${VERSION}-${COMMIT_SHA:0:7} || true
          docker tag galgo-school-server:latest galgo-school-server:${VERSION}-${COMMIT_SHA:0:7} || true
      
      - name: 🏥 Health check
        id: health
        timeout-minutes: 2
        run: |
          echo "🏥 Checking service health..."
          MAX_ATTEMPTS=30
          RETRY_DELAY=2
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Service healthy (attempt $attempt/$MAX_ATTEMPTS)"
              exit 0
            fi
            
            if [ $((attempt % 5)) -eq 0 ]; then
              echo "⏳ Waiting... (attempt $attempt/$MAX_ATTEMPTS)"
              docker-compose ps
            fi
            
            sleep $RETRY_DELAY
          done
          
          echo "❌ Health check failed"
          docker compose logs
